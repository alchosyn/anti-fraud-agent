# 首次部署引导配置：只开 80 端口给 certbot 做 ACME 验证用。
# 流程：用本文件生成 nginx.live.conf 起服务 → 签证书成功 → 用 nginx.conf
# 重新生成 nginx.live.conf 并 reload（详见 DEPLOY.md 第 5-6 步），全程无需手工改配置。

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'bootstrap ok - waiting for TLS certificate';
        add_header Content-Type text/plain;
    }
}
