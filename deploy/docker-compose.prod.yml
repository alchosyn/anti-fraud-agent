# 生产编排：nginx(80/443) → app → db/redis，仅 nginx 对外
#
# 在仓库根目录执行：
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# 前置步骤见 deploy/DEPLOY.md（前端构建、域名、证书）

name: anti-fraud-agent-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: antifraud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d antifraud"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  app:
    build:
      context: ..
      # 国内服务器构建提速：
      # args:
      #   HF_ENDPOINT: https://hf-mirror.com
      #   PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    env_file:
      - ../.env                    # DEEPSEEK_API_KEY / TAVILY_API_KEY / OPENAI_API_KEY
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?set in .env}@db:5432/antifraud
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?generate one: openssl rand -hex 32}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    # 不对外发布端口，只经 nginx

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.live.conf 由 DEPLOY.md 步骤从 nginx.bootstrap.conf / nginx.conf 生成（gitignore）
      - ./nginx.live.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - app
    restart: always

volumes:
  pgdata:
  redisdata:
  letsencrypt:
  certbot-webroot:
